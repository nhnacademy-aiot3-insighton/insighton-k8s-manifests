apiVersion: apps/v1
kind: Deployment
metadata:
  name: insighton-redis-telemetry
  namespace: insighton
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: insighton-redis-telemetry
  template:
    metadata:
      labels:
        app: insighton-redis-telemetry
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--save"
            - ""
            - "--appendonly"
            - "no"
          ports:
            - containerPort: 6379
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insighton-redis-telemetry-secret
                  key: REDIS_PASSWORD
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
              ephemeral-storage: "128Mi"
            limits:
              memory: "256Mi"
              cpu: "250m"
              ephemeral-storage: "128Mi"
