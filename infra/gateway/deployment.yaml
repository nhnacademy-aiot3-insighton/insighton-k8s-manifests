apiVersion: v1
kind: Namespace
metadata:
  name: insighton
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infra-gateway
  namespace: insighton
spec:
  replicas: 2
  selector:
    matchLabels:
      app: infra-gateway
  template:
    metadata:
      labels:
        app: infra-gateway
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: insighton-ghcr-secrete
      containers:
        - name: api-gateway
          image: ghcr.io/nhnacademy-aiot3-insighton/insighton-test-gateway:1985a8a2d3e930c0a5abd2a4643e164df6757828
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"