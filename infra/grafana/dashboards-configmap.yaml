apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: insighton-logging
data:
  insighton-live-logs.json: |
    {
      "uid": "insighton-live-logs",
      "title": "Insighton - Live Logs",
      "tags": ["loki", "insighton"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "time": { "from": "now-5m", "to": "now" },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "app",
            "type": "query",
            "label": "App",
            "datasource": "Loki",
            "query": "label_values({namespace=\"insighton\"}, app)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "pod",
            "type": "query",
            "label": "Pod",
            "datasource": "Kubernetes API",
            "query": {
              "queryType": "infinity",
              "refId": "variable-pod",
              "meta": { "valueField": "pod", "textField": "pod" },
              "infinityQuery": {
                "refId": "variable-pod",
                "type": "json",
                "source": "url",
                "format": "table",
                "url": "https://kubernetes.default.svc/api/v1/namespaces/insighton/pods",
                "url_options": {
                  "method": "GET",
                  "params": [{ "key": "fieldSelector", "value": "status.phase=Running" }]
                },
                "root_selector": "items",
                "columns": [{ "selector": "metadata.name", "text": "pod", "type": "string" }]
              }
            },
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Active Apps (5m)",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "datasource": "Loki",
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "Loki",
              "expr": "count(sum by (app) (count_over_time({namespace=\"insighton\"}[5m])))",
              "queryType": "instant",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Log Lines / sec",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 0 },
          "datasource": "Loki",
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "Loki",
              "expr": "sum(rate({namespace=\"insighton\", app=~\"$app\"}[$__interval]))",
              "queryType": "instant",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Errors (5m)",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "datasource": "Loki",
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": "Loki",
              "expr": "sum(count_over_time({namespace=\"insighton\", app=~\"$app\"} |~ \"(?i)error|exception|panic\" [5m]))",
              "queryType": "instant",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Log Rate by App",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
          "datasource": "Loki",
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": {
            "legend": { "showLegend": true, "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": "Loki",
              "expr": "sum by (app) (rate({namespace=\"insighton\", app=~\"$app\"}[$__interval]))",
              "legendFormat": "{{app}}",
              "queryType": "range",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "Active Pods (last 5m)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 14 },
          "datasource": "Loki",
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "transformations": [
            { "id": "organize", "options": { "renameByName": { "Value": "Log Lines (5m)" } } }
          ],
          "targets": [
            {
              "datasource": "Loki",
              "expr": "topk(20, sum by (app, pod) (count_over_time({namespace=\"insighton\", app=~\"$app\"}[5m])))",
              "queryType": "instant",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Error Rate by App",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 22 },
          "datasource": "Loki",
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": {
            "legend": { "showLegend": true, "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": "Loki",
              "expr": "sum by (app) (rate({namespace=\"insighton\", app=~\"$app\"} |~ \"(?i)error|exception|panic\" [$__interval]))",
              "legendFormat": "{{app}}",
              "queryType": "range",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "logs",
          "title": "Live Logs",
          "gridPos": { "h": 30, "w": 24, "x": 0, "y": 30 },
          "datasource": "Loki",
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Ascending"
          },
          "targets": [
            {
              "datasource": "Loki",
              "expr": "{namespace=\"insighton\", app=~\"$app\", app=~\"insighton-ruleengine|insighton-core|insighton-ai|insighton-auth|insighton-front|insighton-gateway\", pod=~\"$pod\"} |~ \" (WARN|ERROR) \"",
              "queryType": "range",
              "maxLines": 1000,
              "refId": "A"
            }
          ]
        }
      ]
    }
  insighton-logs-by-pod.json: |
    {
      "uid": "insighton-logs-by-pod",
      "title": "Insighton - Logs by Pod",
      "tags": ["loki", "insighton"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "time": { "from": "now-5m", "to": "now" },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "app",
            "type": "query",
            "label": "App",
            "datasource": "Loki",
            "query": "label_values({namespace=\"insighton\"}, app)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "pod",
            "type": "query",
            "label": "Pod",
            "datasource": "Kubernetes API",
            "query": {
              "queryType": "infinity",
              "refId": "variable-pod",
              "meta": { "valueField": "pod", "textField": "pod" },
              "infinityQuery": {
                "refId": "variable-pod",
                "type": "json",
                "source": "url",
                "format": "table",
                "url": "https://kubernetes.default.svc/api/v1/namespaces/insighton/pods",
                "url_options": {
                  "method": "GET",
                  "params": [{ "key": "fieldSelector", "value": "status.phase=Running" }]
                },
                "root_selector": "items",
                "columns": [{ "selector": "metadata.name", "text": "pod", "type": "string" }]
              }
            },
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "logs",
          "title": "$pod",
          "repeat": "pod",
          "repeatDirection": "v",
          "gridPos": { "h": 16, "w": 24, "x": 0, "y": 0 },
          "datasource": "Loki",
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Ascending"
          },
          "targets": [
            {
              "datasource": "Loki",
              "expr": "{namespace=\"insighton\", app=~\"$app\", pod=\"$pod\"}",
              "queryType": "range",
              "maxLines": 1000,
              "refId": "A"
            }
          ]
        }
      ]
    }
