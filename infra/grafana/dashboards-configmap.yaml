apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: insighton-logging
data:
  insighton-live-logs.json: |
    {
      "uid": "insighton-live-logs",
      "title": "Insighton - Live Logs",
      "tags": ["loki", "insighton"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "editable": true,
      "graphTooltip": 1,
      "refresh": "30s",
      "time": { "from": "now-15m", "to": "now" },
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "templating": {
        "list": [
          {
            "name": "app",
            "type": "query",
            "label": "App",
            "datasource": { "type": "loki", "uid": "loki" },
            "query": "label_values({namespace=\"insighton\"}, app)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1,
            "current": { "text": "All", "value": "$__all" }
          },
          {
            "name": "pod",
            "type": "query",
            "label": "Pod",
            "datasource": { "type": "loki", "uid": "loki" },
            "query": "label_values({namespace=\"insighton\", app=~\"$app\"}, pod)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "allValue": ".*",
            "sort": 1,
            "current": { "text": "All", "value": "$__all" }
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Active Apps (5m)",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "count(sum by (app) (count_over_time({namespace=\"insighton\"}[5m])))",
              "queryType": "instant",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Log Lines / sec",
          "gridPos": { "h": 6, "w": 8, "x": 8, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "color": { "mode": "thresholds" },
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(rate({namespace=\"insighton\", app=~\"$app\"}[$__interval]))",
              "queryType": "instant",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Errors (5m)",
          "gridPos": { "h": 6, "w": 8, "x": 16, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "none",
            "justifyMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({namespace=\"insighton\", app=~\"$app\"} |~ \"(?i)error|exception|panic\" [5m]))",
              "queryType": "instant",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Log Rate by App",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": {
            "legend": { "showLegend": true, "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (app) (rate({namespace=\"insighton\", app=~\"$app\"}[$__interval]))",
              "legendFormat": "{{app}}",
              "queryType": "range",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "Active Pods (last 5m)",
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 14 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": {}, "overrides": [] },
          "transformations": [
            { "id": "organize", "options": { "renameByName": { "Value": "Log Lines (5m)" } } }
          ],
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "topk(20, sum by (app, pod) (count_over_time({namespace=\"insighton\", app=~\"$app\"}[5m])))",
              "queryType": "instant",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Error Rate by App",
          "gridPos": { "h": 8, "w": 16, "x": 8, "y": 14 },
          "datasource": { "type": "loki", "uid": "loki" },
          "fieldConfig": { "defaults": { "unit": "short" }, "overrides": [] },
          "options": {
            "legend": { "showLegend": true, "displayMode": "table", "placement": "bottom", "calcs": ["mean", "max"] },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum by (app) (rate({namespace=\"insighton\", app=~\"$app\"} |~ \"(?i)error|exception|panic\" [$__interval]))",
              "legendFormat": "{{app}}",
              "queryType": "range",
              "refId": "A"
            }
          ]
        },
        {
          "id": 7,
          "type": "logs",
          "title": "Live Logs",
          "gridPos": { "h": 24, "w": 24, "x": 0, "y": 22 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": {
            "showTime": true,
            "showLabels": false,
            "showCommonLabels": false,
            "wrapLogMessage": true,
            "prettifyLogMessage": false,
            "enableLogDetails": true,
            "dedupStrategy": "none",
            "sortOrder": "Descending"
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{namespace=\"insighton\", app=~\"$app\", pod=~\"$pod\"}",
              "queryType": "range",
              "maxLines": 1000,
              "refId": "A"
            }
          ]
        }
      ]
    }
