apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: insighton-logging
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: insighton
        orgId: 1
        folder: "Insighton"
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /var/lib/grafana/dashboards
