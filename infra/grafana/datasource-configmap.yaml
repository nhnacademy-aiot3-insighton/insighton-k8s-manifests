apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: insighton-logging
data:
  loki.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.insighton-logging.svc.cluster.local:3100
        isDefault: true
        editable: false
