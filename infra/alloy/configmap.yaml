apiVersion: v1
kind: ConfigMap
metadata:
  name: alloy-config
  namespace: insighton-logging
data:
  config.alloy: |
    discovery.kubernetes "pods" {
      role = "pod"

      namespaces {
        names = ["insighton"]
      }
    }

    discovery.relabel "pods" {
      targets = discovery.kubernetes.pods.targets

      rule {
        source_labels = ["__meta_kubernetes_pod_controller_name"]
        regex         = "([0-9a-z-.]+?)(-[0-9a-f]{8,10})?"
        action        = "replace"
        target_label  = "__tmp_controller_name"
      }

      rule {
        source_labels = [
          "__meta_kubernetes_pod_label_app_kubernetes_io_name",
          "__meta_kubernetes_pod_label_app",
          "__tmp_controller_name",
          "__meta_kubernetes_pod_name",
        ]
        regex        = "^;*([^;]+)(;.*)?$"
        action       = "replace"
        target_label = "app"
      }

      rule {
        source_labels = ["__meta_kubernetes_namespace"]
        action        = "replace"
        target_label  = "namespace"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_name"]
        action        = "replace"
        target_label  = "pod"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_container_name"]
        action        = "replace"
        target_label  = "container"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        action        = "replace"
        target_label  = "node"
      }

      // Only keep pods scheduled on this node — each Alloy DaemonSet pod
      // discovers every pod in the namespace via the k8s API, then filters
      // down to its own node, mirroring the promtail HOSTNAME trick.
      rule {
        source_labels = ["__meta_kubernetes_pod_node_name"]
        regex         = env("HOSTNAME")
        action        = "keep"
      }

      rule {
        source_labels = ["__meta_kubernetes_pod_uid", "__meta_kubernetes_pod_container_name"]
        separator     = "/"
        action        = "replace"
        replacement   = "/var/log/pods/*$1/*.log"
        target_label  = "__path__"
      }
    }

    local.file_match "pods" {
      path_targets = discovery.relabel.pods.output
    }

    loki.source.file "pods" {
      targets    = local.file_match.pods.targets
      forward_to = [loki.process.pods.receiver]
    }

    loki.process "pods" {
      stage.cri {}

      forward_to = [loki.write.default.receiver]
    }

    loki.write "default" {
      endpoint {
        url = "http://loki.insighton-logging.svc.cluster.local:3100/loki/api/v1/push"
      }
    }
