apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: alloy
  namespace: insighton-logging
spec:
  selector:
    matchLabels:
      app: alloy
  template:
    metadata:
      labels:
        app: alloy
    spec:
      serviceAccountName: alloy
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 30
      tolerations:
        - effect: NoSchedule
          operator: Exists
      initContainers:
        - name: sysctl-tune
          image: busybox:1.36
          securityContext:
            privileged: false
            capabilities:
              add: ["SYS_ADMIN"]
          command:
            - sh
            - -c
            - |
              sysctl -w fs.inotify.max_user_instances=1024
              sysctl -w fs.inotify.max_user_watches=1048576
      containers:
        - name: alloy
          image: grafana/alloy:v1.19.1
          command: ["sh", "-c"]
          args:
            - >-
              ulimit -n 65536 &&
              exec /bin/alloy run
              --server.http.listen-addr=0.0.0.0:12345
              --storage.path=/var/lib/alloy/data
              /etc/alloy/config.alloy
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - containerPort: 12345
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/alloy
            - name: pods
              mountPath: /var/log/pods
              readOnly: true
            - name: containers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: alloy-data
              mountPath: /var/lib/alloy/data
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
              ephemeral-storage: "128Mi"
            limits:
              memory: "256Mi"
              cpu: "200m"
              ephemeral-storage: "256Mi"
      volumes:
        - name: config
          configMap:
            name: alloy-config
        - name: pods
          hostPath:
            path: /var/log/pods
        - name: containers
          hostPath:
            path: /var/lib/docker/containers
        - name: alloy-data
          hostPath:
            path: /run/alloy
            type: DirectoryOrCreate
