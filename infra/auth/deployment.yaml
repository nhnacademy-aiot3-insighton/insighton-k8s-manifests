apiVersion: apps/v1
kind: Deployment
metadata:
  name: insighton-auth
  namespace: insighton
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insighton-auth
  template:
    metadata:
      labels:
        app: insighton-auth
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: insighton-ghcr-secret
      containers:
        - name: auth
          image: ghcr.io/nhnacademy-aiot3-insighton/insighton-auth:1031412835f5a0c4740c06379974f93a74364777
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insighton-auth-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: insighton-auth-secret
                  key: DB_HOST
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: insighton-auth-secret
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insighton-auth-secret
                  key: REDIS_PASSWORD
            - name: JWT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: insighton-auth-secret
                  key: JWT_PRIVATE_KEY
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: insighton-auth-secret
                  key: JWT_PUBLIC_KEY
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: insighton-auth-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: insighton-auth-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: GITHUB_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: insighton-auth-secret
                  key: GITHUB_CLIENT_ID
            - name: GITHUB_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: insighton-auth-secret
                  key: GITHUB_CLIENT_SECRET
            - name: BREVO_SMTP_LOGIN
              valueFrom:
                secretKeyRef:
                  name: insighton-auth-secret
                  key: BREVO_SMTP_LOGIN
            - name: BREVO_SMTP_KEY
              valueFrom:
                secretKeyRef:
                  name: insighton-auth-secret
                  key: BREVO_SMTP_KEY
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
              ephemeral-storage: "512Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "512Mi"
