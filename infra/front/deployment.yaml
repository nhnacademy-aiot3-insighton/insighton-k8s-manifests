apiVersion: apps/v1
kind: Deployment
metadata:
  name: insighton-front
  namespace: insighton
spec:
  replicas: 2
  selector:
    matchLabels:
      app: insighton-front
  template:
    metadata:
      labels:
        app: insighton-front
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: insighton-ghcr-secret
      containers:
        - name: front
          image: ghcr.io/nhnacademy-aiot3-insighton/insighton-front:067908d73f2aa74a7c86bc5bee56620e7c538b00
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: TELEMETRY_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: insighton-front-secret
                  key: TELEMETRY_REDIS_HOST
            - name: TELEMETRY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insighton-front-secret
                  key: TELEMETRY_REDIS_PASSWORD
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
              ephemeral-storage: "512Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "512Mi"
