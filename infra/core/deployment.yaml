apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: insighton-core
  namespace: insighton
spec:
  serviceName: insighton-core-headless
  replicas: 2
  selector:
    matchLabels:
      app: insighton-core
  template:
    metadata:
      labels:
        app: insighton-core
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: insighton-ghcr-secret
      containers:
        - name: core
          image: ghcr.io/nhnacademy-aiot3-insighton/insighton-core:b567ca434a176748496d505faa937c9a62ca8d45
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
            - name: INSTANCE_TOTAL_COUNT
              value: "2"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: insighton-core-secret
                  key: DB_HOST
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insighton-core-secret
                  key: DB_PASSWORD
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: insighton-core-secret
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insighton-core-secret
                  key: REDIS_PASSWORD
            - name: TELEMETRY_REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: insighton-core-secret
                  key: TELEMETRY_REDIS_HOST
            - name: TELEMETRY_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insighton-core-secret
                  key: TELEMETRY_REDIS_PASSWORD
            - name: RABBITMQ_HOST
              valueFrom:
                secretKeyRef:
                  name: insighton-core-secret
                  key: RABBITMQ_HOST
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: insighton-core-secret
                  key: RABBITMQ_PASSWORD
            - name: INFLUXDB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: insighton-core-secret
                  key: INFLUXDB_TOKEN
            - name: KMA_KEY
              valueFrom:
                secretKeyRef:
                  name: insighton-core-secret
                  key: KMA_KEY
            - name: AIR_KEY
              valueFrom:
                secretKeyRef:
                  name: insighton-core-secret
                  key: AIR_KEY
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"]
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
              ephemeral-storage: "512Mi"
            limits:
              memory: "512Mi"
              cpu: "500m"
              ephemeral-storage: "512Mi"
